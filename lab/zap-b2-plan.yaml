# ZAP Automation Framework — B2 능동 스캔 (지역아동센터 실습 웹앱)
# 대상: 같은 compose 네트워크(jiacenter-vuln_lab)의 http://web:8000
# 담당: S2 / OWASP A02·A04·A10 (설정·암호화·예외)
#
# excludePaths 는 W가 PR #2에서 전달한 "스캔 제외 경로" 목록이다(2026-11-13).
# 부작용(세션 종료·계정 변경·데이터 생성/삭제·외부 요청)이 있는 경로를
# 범위에서 빼서 스캐너가 공격 요청을 보내지 않도록 한다.
# excludePaths 는 URL 단위라 메서드와 무관하게 제외된다(GET·POST 모두).
env:
  contexts:
    - name: jiacenter
      urls:
        - http://web:8000/
      includePaths:
        - "http://web:8000/.*"
      excludePaths:
        # 관리자 화면 전체 — 로그아웃·비밀번호 변경·모든 모델 추가/수정/삭제
        - "http://web:8000/admin/.*"
        # 계정 생성(일반·전화 인증)
        - "http://web:8000/signup.*"
        # 서버가 입력 URL로 외부 요청(SSRF). 로컬 네트워크로 요청이 나가지 않도록 제외.
        # SSRF 자체는 A01(S1)이 통제된 조건에서 수동 확인.
        - "http://web:8000/embed.*"
        # 출결 기록 생성·수정, 아동 명단 대량 생성 (kiosk/board/import/export 포함)
        - "http://web:8000/attendance/.*"
        # 게시판 쓰기·댓글·수정·삭제
        - "http://web:8000/board/posts/new/.*"
        - "http://web:8000/board/posts/\\d+/edit/.*"
        - "http://web:8000/board/posts/\\d+/delete/.*"
        - "http://web:8000/board/posts/\\d+/.*"
        # 파일 업로드(데이터 생성)
        - "http://web:8000/my.*"
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  # 스코프 안만 크롤. 폼 제출은 하지 않는다(제외 밖 POST로 데이터가 생기지 않도록).
  - type: spider
    parameters:
      context: jiacenter
      url: http://web:8000/
      maxDuration: 3
      postForm: false
      processForm: false
  - type: passiveScan-wait
    parameters:
      maxDuration: 3
  - type: activeScan
    parameters:
      context: jiacenter
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 8
  - type: passiveScan-wait
    parameters:
      maxDuration: 3
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: b2-active.json
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: b2-active.html
